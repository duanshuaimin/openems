# ==========================================
# 1. OpenEMS Edge UI (Local Microgrid UI)
# ==========================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 4200;
    listen [::]:4200;

    server_name _;

    root /opt/openems/ui;
    index index.html index.htm;

    # OpenEMS UI static files & SPA router
    location / {
        try_files $uri $uri/ /index.html;
        error_page 404 = /index.html;
    }

    # OpenEMS Edge WebSocket Proxy (for relative websocket clients)
    location /openems-edge {
        proxy_pass http://127.0.0.1:8075;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Apache Felix Web Console proxy
    location /system/console {
        proxy_pass http://127.0.0.1:8080/system/console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dynatrace-Style Smartscape Full-Stack Interactive Topology
    location /smartscape {
        alias /opt/openems/smartscape;
        index index.html;
        try_files $uri $uri/ /smartscape/index.html;
    }

    # OpenEMS Edge REST API Proxy (Read-Only GET + guest RBAC)
    location /openems-rest/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8095/rest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic Z3Vlc3Q6Z3Vlc3Q=";
    }

    # OpenEMS InfluxDB Query Proxy (Scoped Read-Only Token)
    location /openems-influx {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:8086/api/v2/query?orgID=6cbd3b34c2aada40;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Token <INFLUX_READONLY_TOKEN>";
        proxy_set_header Content-Type "application/vnd.flux";
    }
}

# ==========================================
# 2. OpenEMS Backend UI (Cloud Multi-Tenant UI)
# ==========================================
